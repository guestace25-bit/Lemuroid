name: Build Corruptor APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleFreeDynamicDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lemuroid-corruptor-debug
          path: lemuroid-app/build/outputs/apk/freeDynamic/debug/*.apk
